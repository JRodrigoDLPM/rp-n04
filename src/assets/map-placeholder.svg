<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title">
  <title id="title">Mapa de ruta ilustrativo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9f7fb"/>
      <stop offset="55%" stop-color="#f3fbfe"/>
      <stop offset="100%" stop-color="#e6f4f7"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfeef6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#bfe6f0" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <path d="M0 350 C120 300 200 420 360 360 S560 240 800 300 L800 480 L0 480 Z" fill="url(#water)"/>
  <g opacity="0.55" fill="#c8dbe3">
    <rect x="120" y="90" width="140" height="90" rx="18"/>
    <rect x="320" y="70" width="110" height="70" rx="16"/>
    <rect x="520" y="120" width="160" height="100" rx="20"/>
    <rect x="220" y="240" width="130" height="80" rx="16"/>
    <rect x="430" y="210" width="150" height="95" rx="18"/>
  </g>
  <path
    d="M120 320 C200 250 280 260 360 220 S520 150 640 180 S720 200 760 160"
    fill="none"
    stroke="#7cc4d4"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
    filter="url(#soft)"
  />
  <path
    d="M120 320 C200 250 280 260 360 220 S520 150 640 180 S720 200 760 160"
    fill="none"
    stroke="#1f9aaa"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="10 12"
  />
  <circle cx="120" cy="320" r="12" fill="#1f9aaa" stroke="#ffffff" stroke-width="4"/>
  <circle cx="360" cy="220" r="12" fill="#f6b44c" stroke="#ffffff" stroke-width="4"/>
  <circle cx="760" cy="160" r="14" fill="#2bb3a8" stroke="#ffffff" stroke-width="4"/>
  <text x="40" y="56" font-family="ui-sans-serif, system-ui" font-size="22" fill="#226a76" opacity="0.75">TrustLay Maps · Vista previa</text>
</svg>
